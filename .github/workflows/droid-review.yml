# factory-automation: 0ffc5a82-3e4a-4a65-bf05-88fdf24749b7
name: Droid Code Review
"on":
  workflow_dispatch: {}
  pull_request:
    types:
      - opened
  push:
    branches:
      - "**"
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Factory droid-action
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_depth: shallow
          review_model: mistral-large-4
          reasoning_effort: high
          allowed_bots: factory-droid[bot]
